name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Shifty.xcodeproj
  SCHEME: Shifty

jobs:
  debug-and-tests:
    name: Debug build and unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -only-testing:ShiftyTests \
            -resultBundlePath TestResults.xcresult | xcbeautify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  release:
    name: Universal Release build and static analysis
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: Build (Release, arm64 + x86_64)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild analyze \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO | xcbeautify
